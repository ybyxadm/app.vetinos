<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Sistema em Manutenção | Vetinos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center font-sans p-6 text-center">
  <div class="max-w-md w-full space-y-4 bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl">
    <div class="text-4xl mb-2">🛠️</div>

    <div class="pt-4">
      <button onclick="window.location.reload()" class="bg-orange-500 hover:bg-orange-600 text-white text-xs font-semibold px-4 py-2 rounded-xl transition-colors">
        Tentar Novamente

  </div>
