<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventário & Contagem | Vetinos — YBYX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css?v=20261119-sidebar-nav">
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: 'var(--ybyx-primary, #f97316)', primaryHover: 'var(--ybyx-primary-hover, #ea580c)' } } } }
  </script>
</head>
<body id="app-body" class="bg-slate-100 text-slate-800 min-h-screen flex font-sans">

  <aside id="app-sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col z-30 transition-all duration-300 no-print"></aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 h-16 px-6 flex items-center justify-between no-print">
      <h1 class="text-base font-bold text-slate-900">Inventário & Contagem Física</h1>
      <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold py-2 px-4 rounded-xl transition-colors">🖨️ Imprimir Folha de Contagem</button>
    </header>

    <main class="p-6 flex-1 overflow-y-auto space-y-6"><div class="rounded-xl border border-amber-200 bg-amber-50 p-3 text-xs text-amber-900">O inventário consulta o catálogo salvo neste navegador. As alterações ainda não são sincronizadas com outros dispositivos ou com o Firestore.</div><p id="inventory-feedback" role="status" aria-live="polite" class="hidden text-sm"></p>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="border-b border-slate-200 bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
              <th class="py-3 px-4 font-semibold">Produto</th>
              <th class="py-3 px-4 font-semibold">Estoque Sistema</th>
              <th class="py-3 px-4 font-semibold">Contagem Física</th>
              <th class="py-3 px-4 font-semibold">Diferença (+/-)</th>
              <th class="py-3 px-4 text-right font-semibold no-print">Ações</th>
            </tr>
          </thead>
          <tbody id="inventory-table-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="assets/js/sidebar.js?v=20261119-sidebar-nav"></script>
  <script src="assets/js/products-store.js"></script>
  <script>
    renderSidebar("inventario");
    const store = window.VetinosProducts;
    const tbody = document.getElementById("inventory-table-body");
    const feedback = document.getElementById("inventory-feedback");

    function showInventoryFeedback(message, isError) {
      feedback.textContent = message;
      feedback.className = "text-sm " + (isError ? "text-red-700" : "text-green-700");
    }

    function loadInventory() {
      try {
        const products = store.getProducts();
        if (!products.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-400">Nenhum produto no estoque para inventário.</td></tr>';
          return;
        }
        tbody.innerHTML = products.map(function (p) {
          const systemStock = Number(p.stock) || 0;
          const physicalStock = p.physicalStock === undefined ? systemStock : Number(p.physicalStock) || 0;
          const difference = physicalStock - systemStock;
          const badgeClass = difference > 0 ? "bg-green-100 text-green-700" :
            difference < 0 ? "bg-red-100 text-red-700" : "bg-slate-100 text-slate-700";
          const differenceText = difference > 0 ? "+" + difference : String(difference);
          const id = store.escapeHtml(p.id);
          return '<tr class="hover:bg-slate-50">' +
            '<td class="py-3 px-4 font-medium text-slate-900">' + store.escapeHtml(p.name) + ' <span class="text-xs font-mono text-slate-400">(' + store.escapeHtml(p.code) + ')</span></td>' +
            '<td class="py-3 px-4 font-semibold text-slate-700">' + systemStock + ' un</td>' +
            '<td class="py-3 px-4"><div class="flex items-center gap-2">' +
              '<button type="button" data-adjust-id="' + id + '" data-delta="-1" class="w-7 h-7 bg-slate-200 hover:bg-slate-300 rounded-lg font-bold text-slate-700">-</button>' +
              '<span class="w-8 text-center font-bold">' + physicalStock + '</span>' +
              '<button type="button" data-adjust-id="' + id + '" data-delta="1" class="w-7 h-7 bg-slate-200 hover:bg-slate-300 rounded-lg font-bold text-slate-700">+</button>' +
            '</div></td>' +
            '<td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-xs font-bold ' + badgeClass + '">' + differenceText + '</span></td>' +
            '<td class="py-3 px-4 text-right no-print"><button type="button" data-save-id="' + id + '" class="text-xs bg-primary text-white px-3 py-1.5 rounded-lg font-semibold">Aplicar contagem</button></td>' +
          '</tr>';
        }).join("");
      } catch (error) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-red-700">Não foi possível carregar o inventário.</td></tr>';
        showInventoryFeedback(error.message, true);
        console.error("Erro ao carregar inventário:", error);
      }
    }

    function adjustStock(id, delta) {
      try {
        const product = store.getProducts().find(function (item) { return String(item.id) === String(id); });
        if (!product) throw new Error("Produto não encontrado.");
        const current = product.physicalStock === undefined ? Number(product.stock) || 0 : Number(product.physicalStock) || 0;
        store.updateProduct(id, { physicalStock: Math.max(0, current + delta) });
        loadInventory();
      } catch (error) {
        showInventoryFeedback("Não foi possível atualizar a contagem: " + error.message, true);
      }
    }

    function saveCount(id) {
      try {
        const product = store.getProducts().find(function (item) { return String(item.id) === String(id); });
        if (!product) throw new Error("Produto não encontrado.");
        const physicalStock = product.physicalStock === undefined ? Number(product.stock) || 0 : Number(product.physicalStock) || 0;
        store.updateProduct(id, { stock: physicalStock, physicalStock: physicalStock });
        showInventoryFeedback("Contagem aplicada ao catálogo deste navegador. A alteração também aparece em Cadastro de Produtos e Relatórios.", false);
        loadInventory();
      } catch (error) {
        showInventoryFeedback("Não foi possível aplicar a contagem: " + error.message, true);
      }
    }

    tbody.addEventListener("click", function (event) {
      const adjustButton = event.target.closest("[data-adjust-id]");
      const saveButton = event.target.closest("[data-save-id]");
      if (adjustButton) adjustStock(adjustButton.dataset.adjustId, Number(adjustButton.dataset.delta));
      if (saveButton) saveCount(saveButton.dataset.saveId);
    });

    window.adjustStock = adjustStock;
    window.saveCount = saveCount;
    window.addEventListener("vetinos:products-updated", loadInventory);
    loadInventory();
  </script>
</body>
</html>
