<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validades & Lotes | Vetinos — YBYX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: 'var(--ybyx-primary, #f97316)', primaryHover: 'var(--ybyx-primary-hover, #ea580c)', primaryLight: 'var(--ybyx-primary-light, #fff7ed)' } } } }
  </script>
</head>
<body id="app-body" class="bg-[var(--ybyx-primary-light)] text-slate-800 min-h-screen flex font-sans transition-colors duration-300">

  <aside id="app-sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col z-30 transition-all duration-300 no-print shadow-sm"></aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 h-16 px-6 flex items-center justify-between no-print shadow-xs">
      <h1 class="text-base font-bold text-slate-900">Monitor de Validades & Lotes</h1>
      <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold py-2 px-4 rounded-xl transition-colors">🖨️ Imprimir Relatório</button>
    </header>

    <main class="p-6 flex-1 overflow-y-auto space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="border-b border-slate-200 bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
              <th class="py-3 px-4 font-semibold">Produto</th>
              <th class="py-3 px-4 font-semibold">Lote</th>
              <th class="py-3 px-4 font-semibold">Validade</th>
              <th class="py-3 px-4 font-semibold">Localização</th>
              <th class="py-3 px-4 font-semibold">Status de Urgência</th>
            </tr>
          </thead>
          <tbody id="validities-table-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="assets/js/sidebar.js"></script>
  <script>
    renderSidebar('validades');

    function loadValidities() {
      let list = JSON.parse(localStorage.getItem('ybyx_validities') || '[]');
      const tbody = document.getElementById('validities-table-body');
      tbody.innerHTML = list.length === 0 ? `<tr><td colspan="5" class="p-4 text-center text-slate-400">Nenhum lote registrado. Cadastre produtos no estoque.</td></tr>` : '';
      
      list.forEach(v => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="py-3 px-4 font-medium text-slate-900">${v.name}</td>
            <td class="py-3 px-4 font-mono text-xs text-slate-600">${v.batch}</td>
            <td class="py-3 px-4 font-mono text-xs font-semibold text-slate-800">${v.expiryDisplay || v.expiry}</td>
            <td class="py-3 px-4 text-slate-600">${v.location}</td>
            <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-800">No Prazo</span></td>
          </tr>
        `;
      });
    }

    window.addEventListener('DOMContentLoaded', loadValidities);
  </script>
</body>
</html>
