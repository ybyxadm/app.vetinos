<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validades & Lotes | Vetinos — YBYX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css?v=20261119-sidebar-nav">
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: 'var(--ybyx-primary, #f97316)', primaryHover: 'var(--ybyx-primary-hover, #ea580c)', primaryLight: 'var(--ybyx-primary-light, #fff7ed)' } } } }
  </script>
</head>
<body id="app-body" class="bg-[var(--ybyx-primary-light)] text-slate-800 min-h-screen flex font-sans transition-colors duration-300">

  <aside id="app-sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col z-30 transition-all duration-300 no-print shadow-sm"></aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 h-16 px-6 flex items-center justify-between no-print shadow-xs">
      <h1 class="text-base font-bold text-slate-900">Monitor de Validades & Lotes</h1>
      <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold py-2 px-4 rounded-xl transition-colors">🖨️ Imprimir Relatório</button>
    </header>

    <main class="p-6 flex-1 overflow-y-auto space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="border-b border-slate-200 bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
              <th class="py-3 px-4 font-semibold">Produto</th>
              <th class="py-3 px-4 font-semibold">Lote</th>
              <th class="py-3 px-4 font-semibold">Validade</th>
              <th class="py-3 px-4 font-semibold">Localização</th>
              <th class="py-3 px-4 font-semibold">Status de Urgência</th>
            </tr>
          </thead>
          <tbody id="validities-table-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="assets/js/sidebar.js?v=20261119-sidebar-nav"></script>
  <script src="assets/js/products-store.js"></script>
  <script>
    renderSidebar("validades");

    function getExpiryStatus(expiry) {
      const match = String(expiry || "").match(/^(0[1-9]|1[0-2])\/(\d{4})$/);
      if (!match) return { label: "Data inválida", className: "bg-slate-100 text-slate-700" };
      const month = Number(match[1]);
      const year = Number(match[2]);
      const expiryDate = new Date(year, month, 0, 23, 59, 59);
      const days = Math.ceil((expiryDate.getTime() - Date.now()) / 86400000);
      if (days < 0) return { label: "Vencido", className: "bg-red-100 text-red-800" };
      if (days <= 30) return { label: "Vence em até 30 dias", className: "bg-amber-100 text-amber-800" };
      return { label: "No prazo", className: "bg-green-100 text-green-800" };
    }

    function loadValidities() {
      const tbody = document.getElementById("validities-table-body");
      try {
        const list = window.VetinosProducts.getValidities();
        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-400">Nenhuma validade cadastrada. Cadastre produtos no estoque.</td></tr>';
          return;
        }
        tbody.innerHTML = list.map(function (item) {
          const expiry = item.expiryDisplay || item.expiry || "";
          const status = getExpiryStatus(expiry);
          const safe = window.VetinosProducts.escapeHtml;
          return '<tr class="hover:bg-slate-50">' +
            '<td class="py-3 px-4 font-medium text-slate-900">' + safe(item.name) + '</td>' +
            '<td class="py-3 px-4 font-mono text-xs text-slate-600">' + safe(item.batch || "Não informado") + '</td>' +
            '<td class="py-3 px-4 font-mono text-xs font-semibold text-slate-800">' + safe(expiry) + '</td>' +
            '<td class="py-3 px-4 text-slate-600">' + safe(item.location || "Não informado") + '</td>' +
            '<td class="py-3 px-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ' + status.className + '">' + status.label + '</span></td>' +
          '</tr>';
        }).join("");
      } catch (error) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-red-700">Não foi possível carregar as validades.</td></tr>';
        console.error("Erro ao carregar validades:", error);
      }
    }

    window.addEventListener("vetinos:products-updated", loadValidities);
    loadValidities();
  </script>
</body>
</html>
