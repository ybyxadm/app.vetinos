<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Admin Provisório | Vetinos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans p-6">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-block bg-orange-500 text-white font-bold px-4 py-1.5 rounded-xl text-sm tracking-wide">Provisório</div>
      <h1 class="text-xl font-bold text-white">Criar Conta de Administrador</h1>
      <p class="text-xs text-slate-400">Insira seus dados para gerar o acesso mestre e destravar o sistema.</p>
    </div>

    <!-- MENSAGEM -->
    <div id="alert-box" class="hidden text-xs p-3 rounded-xl border text-center"></div>

    <form id="form-criar" onsubmit="criarAdmin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">E-mail</label>
        <input type="email" id="email" required placeholder="seu-email@dominio.com" class="w-full text-sm px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-orange-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Senha (mínimo 6 caracteres)</label>
        <input type="password" id="senha" required minlength="6" value="a28284646" class="w-full text-sm px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-orange-500">
      </div>
      <button type="submit" id="btn-criar" class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg shadow-orange-500/20">
        Criar Meu Acesso Admin
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="acesso.html" class="text-xs text-orange-400 hover:underline">Ir para a Tela de Login →</a>
    </div>
  </div>

  <script type="module">
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { db } from "./src/firebase.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const auth = getAuth();

    window.criarAdmin = async function(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const alertBox = document.getElementById('alert-box');
      const btn = document.getElementById('btn-criar');

      alertBox.classList.add('hidden');
      btn.innerText = "Criando conta...";
      btn.disabled = true;

      try {
        // 1. Cria usuário no Auth do Firebase
        const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
        const uid = userCredential.user.uid;

        // 2. Salva permissão de admin no Firestore
        await setDoc(doc(db, "usuarios", uid), {
          email: email,
          cargo: "admin",
          criadoEm: new Date().toISOString()
        });

        alertBox.className = "text-xs p-3 rounded-xl border text-center bg-emerald-500/10 border-emerald-500/30 text-emerald-400";
        alertBox.innerText = "Conta criada com sucesso! Redirecionando...";
        alertBox.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1500);

      } catch (error) {
        console.error("Erro:", error.code);
        let msg = "Erro ao criar conta: " + error.message;
        if (error.code === 'auth/email-already-in-use') msg = "Este e-mail já está cadastrado. Tente fazer login.";

        alertBox.className = "text-xs p-3 rounded-xl border text-center bg-red-500/10 border-red-500/30 text-red-400";
        alertBox.innerText = msg;
        alertBox.classList.remove('hidden');
        btn.innerText = "Criar Meu Acesso Admin";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
