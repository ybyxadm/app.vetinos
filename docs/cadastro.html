<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastros (Tutores & Pet) | Vetinos — YBYX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: 'var(--ybyx-primary, #f97316)', primaryHover: 'var(--ybyx-primary-hover, #ea580c)' } } } }
  </script>
</head>
<body id="app-body" class="bg-slate-100 text-slate-800 min-h-screen flex font-sans">

  <aside id="app-sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col z-30 transition-all duration-300 no-print"></aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 h-16 px-6 flex items-center justify-between no-print">
      <h1 class="text-base font-bold text-slate-900">Cadastro de Tutores & Pets</h1>
      <button onclick="openClientModal()" class="bg-primary hover:bg-primaryHover text-white text-xs font-semibold py-2 px-4 rounded-xl transition-colors shadow-sm">+ Novo Tutor / Pet</button>
    </header>

    <main class="p-6 flex-1 overflow-y-auto space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="border-b border-slate-200 bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
              <th class="py-3 px-4 font-semibold">Tutor / Cliente</th>
              <th class="py-3 px-4 font-semibold">Contato / Telefone</th>
              <th class="py-3 px-4 font-semibold">Nome do Pet</th>
              <th class="py-3 px-4 font-semibold">Espécie / Raça</th>
              <th class="py-3 px-4 text-right font-semibold no-print">Ações</th>
            </tr>
          </thead>
          <tbody id="clients-table-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="client-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl p-6 max-w-lg w-full space-y-4 shadow-xl">
      <h3 class="text-base font-bold text-slate-900">Cadastrar Tutor & Pet</h3>
      <form id="client-form" onsubmit="handleClientSubmit(event)" class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nome do Tutor *</label>
            <input type="text" id="c-owner" required placeholder="Ex: Ana Souza" class="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Telefone *</label>
            <input type="text" id="c-phone" required placeholder="(11) 98765-4321" class="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nome do Pet *</label>
            <input type="text" id="c-petname" required placeholder="Ex: Mel" class="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Espécie / Raça *</label>
            <input type="text" id="c-species" required placeholder="Ex: Canino (Poodle)" class="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg">
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeClientModal()" class="px-4 py-2 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-xs bg-primary text-white font-semibold rounded-lg">Salvar Cadastro</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/sidebar.js"></script>
  <script>
    renderSidebar('cadastro');

    function getClients() {
      const data = localStorage.getItem('ybyx_clients');
      if (!data) {
        const initial = [
          { id: '1', owner: 'Mariana Silva', phone: '(11) 99123-4567', petname: 'Thor', species: 'Canino (Golden Retriever)' }
        ];
        localStorage.setItem('ybyx_clients', JSON.stringify(initial));
        return initial;
      }
      return JSON.parse(data);
    }

    function loadClients() {
      const list = getClients();
      const tbody = document.getElementById('clients-table-body');
      tbody.innerHTML = list.length === 0 ? `<tr><td colspan="5" class="p-4 text-center text-slate-400">Nenhum cadastro encontrado.</td></tr>` : '';
      list.forEach(c => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="py-3 px-4 font-medium text-slate-900">${c.owner}</td>
            <td class="py-3 px-4 text-slate-600">${c.phone}</td>
            <td class="py-3 px-4 font-semibold text-primary">${c.petname}</td>
            <td class="py-3 px-4 text-slate-600">${c.species}</td>
            <td class="py-3 px-4 text-right no-print"><button onclick="deleteClient('${c.id}')" class="text-slate-400 hover:text-red-600 text-xs">Excluir</button></td>
          </tr>
        `;
      });
    }

    function openClientModal() { document.getElementById('client-form').reset(); document.getElementById('client-modal').classList.remove('hidden'); }
    function closeClientModal() { document.getElementById('client-modal').classList.add('hidden'); }

    function handleClientSubmit(e) {
      e.preventDefault();
      let list = getClients();
      list.push({
        id: Date.now().toString(),
        owner: document.getElementById('c-owner').value,
        phone: document.getElementById('c-phone').value,
        petname: document.getElementById('c-petname').value,
        species: document.getElementById('c-species').value
      });
      localStorage.setItem('ybyx_clients', JSON.stringify(list));
      closeClientModal();
      loadClients();
    }

    function deleteClient(id) {
      if (confirm('Deseja excluir este cadastro?')) {
        localStorage.setItem('ybyx_clients', JSON.stringify(getClients().filter(c => c.id !== id)));
        loadClients();
      }
    }

    window.addEventListener('DOMContentLoaded', loadClients);
  </script>
</body>
</html>
