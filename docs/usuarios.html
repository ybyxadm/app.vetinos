<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Usuários | Vetinos — YBYX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css?v=20261119-sidebar-nav">
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: 'var(--ybyx-primary, #f97316)', primaryHover: 'var(--ybyx-primary-hover, #ea580c)', primaryLight: 'var(--ybyx-primary-light, #fff7ed)' } } } }
  </script>
</head>
<body id="app-body" class="bg-[var(--ybyx-primary-light)] text-slate-800 min-h-screen flex font-sans transition-colors duration-300">

  <aside id="app-sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col z-30 transition-all duration-300 no-print shadow-sm"></aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 h-16 px-6 flex items-center justify-between no-print shadow-xs">
      <h1 class="text-base font-bold text-slate-900">Gestão de Usuários & Níveis de Acesso</h1>
      <button onclick="openUserModal()" class="bg-primary hover:bg-primaryHover text-white text-xs font-semibold py-2 px-4 rounded-xl transition-colors shadow-sm">+ Novo Usuário</button>
    </header>

    <main class="p-6 flex-1 overflow-y-auto space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="border-b border-slate-200 bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
              <th class="py-3 px-4 font-semibold">Nome</th>
              <th class="py-3 px-4 font-semibold">E-mail</th>
              <th class="py-3 px-4 font-semibold">Cargo / Perfil</th>
              <th class="py-3 px-4 text-right font-semibold no-print">Ações</th>
            </tr>
          </thead>
          <tbody id="users-table-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="user-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full space-y-4 shadow-xl">
      <h3 class="text-base font-bold text-slate-900">Cadastrar Novo Usuário</h3>
      <form id="user-form" onsubmit="handleUserSubmit(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Nome *</label>
          <input type="text" id="u-name" required placeholder="Ex: Dr. Carlos" class="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">E-mail *</label>
          <input type="email" id="u-email" required placeholder="carlos@vetinos.com" class="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Perfil *</label>
          <select id="u-role" class="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg bg-white">
            <option value="admin">Administrador</option>
            <option value="veterinario">Veterinário</option>
            <option value="balconista">Balconista</option>
          </select>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeUserModal()" class="px-4 py-2 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-xs bg-primary text-white font-semibold rounded-lg">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/sidebar.js?v=20261119-sidebar-nav"></script>
  <script>
    renderSidebar('usuarios');

    function loadUsers() {
      let users = JSON.parse(localStorage.getItem('ybyx_users') || '[]');
      if (users.length === 0) {
        users = [{ id: '1', name: 'Administrador Master', email: 'admin@vetinos.com', role: 'admin' }];
        localStorage.setItem('ybyx_users', JSON.stringify(users));
      }
      const tbody = document.getElementById('users-table-body');
      tbody.innerHTML = '';
      users.forEach(u => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="py-3 px-4 font-medium text-slate-900">${u.name}</td>
            <td class="py-3 px-4 text-slate-600">${u.email}</td>
            <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-purple-100 text-purple-800">${u.role.toUpperCase()}</span></td>
            <td class="py-3 px-4 text-right no-print"><button onclick="deleteUser('${u.id}')" class="text-slate-400 hover:text-red-600 text-xs">Excluir</button></td>
          </tr>
        `;
      });
    }

    function openUserModal() { document.getElementById('user-form').reset(); document.getElementById('user-modal').classList.remove('hidden'); }
    function closeUserModal() { document.getElementById('user-modal').classList.add('hidden'); }

    function handleUserSubmit(e) {
      e.preventDefault();
      let users = JSON.parse(localStorage.getItem('ybyx_users') || '[]');
      users.push({
        id: Date.now().toString(),
        name: document.getElementById('u-name').value,
        email: document.getElementById('u-email').value,
        role: document.getElementById('u-role').value
      });
      localStorage.setItem('ybyx_users', JSON.stringify(users));
      closeUserModal();
      loadUsers();
    }

    function deleteUser(id) {
      if (confirm('Deseja excluir?')) {
        localStorage.setItem('ybyx_users', JSON.stringify(JSON.parse(localStorage.getItem('ybyx_users')).filter(u => u.id !== id)));
        loadUsers();
      }
    }

    window.addEventListener('DOMContentLoaded', loadUsers);
  </script>
</body>
</html>
